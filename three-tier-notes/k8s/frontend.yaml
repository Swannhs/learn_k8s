apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: three-tier-notes-frontend:k8s
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: three-tier-notes
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
